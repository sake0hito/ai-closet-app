<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>digi-set（デジゼット）</title>
<!-- アプリアイコン / ファビコン（親フォルダの画像を参照） -->
<link rel="icon" type="image/png" href="https://sake0hito.github.io/ai-closet-app/digi-set-icon-512.png">
<link rel="apple-touch-icon" href="https://sake0hito.github.io/ai-closet-app/digi-set-icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea5e9">
<meta name="description" content="digi-set（デジゼット）は、自分の持っている服を登録するだけで、天気やトレンドに合わせてAIが毎日のコーディネートを提案してくれるWebアプリです。ログイン不要のお試しモードあり。">
<!-- OGP / Twitter Card（Discord・SNSのリンクカード用） -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="digi-set">
<meta property="og:title" content="digi-set（デジゼット）｜手持ちの服でAIが毎日のコーデを提案">
<meta property="og:description" content="digi-set（デジゼット）は、自分の持っている服を登録するだけで、天気やトレンドに合わせてAIが毎日のコーディネートを提案してくれるWebアプリです。ログイン不要のお試しモードあり。">
<meta property="og:image" content="https://sake0hito.github.io/ai-closet-app/digi-set-icon-512.png">
<meta property="og:url" content="https://ai-closet-app.vercel.app">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="digi-set（デジゼット）｜手持ちの服でAIが毎日のコーデを提案">
<meta name="twitter:description" content="自分の服を登録するだけで、天気やトレンドに合わせてAIが毎日のコーデを提案。ログイン不要のお試しモードあり。">
<meta name="twitter:image" content="https://sake0hito.github.io/ai-closet-app/digi-set-icon-512.png">
<link rel="stylesheet" href="style.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- model-viewer（3D / AR表示） -->
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<!-- 文字コード変換（ZOZO検索のShift_JISキーワード用。読めなくても検索リンクはGoogleに自動退避） -->
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.2.0/encoding.min.js"></script>
</head>
<body class="theme-morning">

<!-- Auth Overlay (Login/Register) -->
<div id="auth-overlay">
  <div class="auth-card">
    <h2>digi-set</h2>
    <p style="margin:-6px 0 10px; font-size:0.8rem; color:var(--text-secondary);">デジゼット｜手持ちの服でAIが毎日のコーデ提案</p>
    <p>あなた専用のクローゼットを作るために、ログインまたは登録をお願いします。</p>
    <button id="btn-google-login" class="auth-btn-google">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G" style="width:18px;">
      Googleで続ける（ログイン / 登録）
    </button>
    <hr>
    <p style="margin-bottom:8px;">またはメールアドレスで</p>
    <div id="auth-tabs" style="display:flex; gap:8px; margin-bottom:10px;">
      <button type="button" id="auth-tab-login" onclick="setAuthMode('login')" style="flex:1; padding:9px; border-radius:8px; border:1px solid var(--primary-color); background:var(--primary-color); color:#fff; font-weight:bold; cursor:pointer;">ログイン</button>
      <button type="button" id="auth-tab-register" onclick="setAuthMode('register')" style="flex:1; padding:9px; border-radius:8px; border:1px solid var(--primary-color); background:transparent; color:var(--primary-color); font-weight:bold; cursor:pointer;">新規登録</button>
    </div>
    <p id="auth-mode-hint" style="margin-bottom:8px; font-size:0.82rem; color:var(--text-secondary);">アカウントをお持ちの方：メールとパスワードでログイン</p>
    <input type="email" id="auth-email" placeholder="メールアドレス">
    <input type="password" id="auth-password" placeholder="パスワード (6文字以上)">
    <button type="button" id="btn-email-login" class="auth-btn-primary">ログイン</button>
    <button type="button" id="btn-email-register" class="auth-btn-primary" style="display:none;">新規登録する</button>
    <div id="auth-error" style="color: #ef4444; font-size: 0.8rem; margin-top: 12px; min-height: 1.2rem;"></div>
    <button type="button" id="btn-skip-login" style="background:none; border:none; color:var(--text-secondary); text-decoration:underline; font-size:0.85rem; margin-top:6px; cursor:pointer;">登録せずに試す（お試しモード）</button>
  </div>
</div>

<div id="app-container">
  <!-- Header -->
  <header id="app-header">
    <h1 id="header-title">ホーム</h1>
    <div id="header-actions"></div>
  </header>

  <!-- Main Content Area -->
  <main id="main-content">
    <!-- 画面コンテンツがここに動的にレンダリングされます -->
  </main>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-target="home">
      <i data-lucide="home"></i>
      <span>ホーム</span>
    </button>
    <button class="nav-btn" data-target="closet">
      <i data-lucide="shirt"></i>
      <span>クローゼット</span>
    </button>
    <button class="nav-btn" data-target="history">
      <i data-lucide="calendar"></i>
      <span>履歴</span>
    </button>
    <button class="nav-btn" data-target="settings">
      <i data-lucide="settings"></i>
      <span>設定</span>
    </button>
  </nav>
</div>

<!-- Floating Action Button for Adding Clothes -->
<button id="fab-add" class="hidden">
  <i data-lucide="plus"></i>
</button>

<!-- Native Camera/File Input -->
<input type="file" id="native-camera-input" accept="image/*" class="hidden">

<!-- Modal Container -->
<div id="modal-container" class="hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
